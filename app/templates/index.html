<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="description" content="Encuentra las mejores recomendaciones de destinos turísticos.">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inicio - Recomendación Turística</title>
  <!-- Bootstrap CSS -->
  <link 
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" 
    rel="stylesheet"
  >
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <!-- Font Awesome -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link rel="shortcut icon" href="{{ url_for('static', filename='favicon.ico') }}" type="image/x-icon">
  <style>
    :root {
      /* Paleta de colores modernizada */
      --primary-color: #2563eb; /* Azul más vibrante */
      --primary-dark: #1e40af; /* Azul oscuro para hover */
      --primary-light: #dbeafe; /* Azul claro para fondos */
      --secondary-color: #f59e0b; /* Naranja para acentos */
      --dark-color: #1e293b; /* Casi negro para texto */
      --light-color: #ffffff; /* Blanco para fondos */
      --overlay-color: rgba(15, 23, 42, 0.6); /* Capa oscura mejorada */
      --transition: all 0.3s ease; /* Transición global */
    }
    
    /* Estilos para el video de fondo */
    #bgVideo {
      position: fixed;
      top: 0;
      left: 0;
      min-width: 100%;
      min-height: 100%;
      width: auto;
      height: auto;
      z-index: -1;
      object-fit: cover;
      filter: brightness(0.9);
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      color: var(--light-color);
      font-family: 'Poppins', sans-serif;
      scroll-behavior: smooth;
    }

    /* Capa oscura para mejorar el contraste del texto sobre el video */
    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: var(--overlay-color);
      z-index: 0;
    }

    /* Barra de navegación */
    .navbar {
      background-color: rgba(0, 0, 0, 0.2) !important;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      z-index: 10;
      padding: 1rem 0;
      transition: var(--transition);
    }
    
    .navbar.scrolled {
      background-color: var(--primary-dark) !important;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
      padding: 0.75rem 0;
    }

    .navbar-brand {
      font-family: 'Montserrat', sans-serif;
      font-weight: 700;
      font-size: 1.5rem;
      color: var(--light-color);
    }
    
    .nav-link {
      font-weight: 500;
      margin: 0 0.5rem;
      position: relative;
      transition: var(--transition);
    }
    
    .nav-link:after {
      content: '';
      position: absolute;
      width: 0;
      height: 2px;
      bottom: 0;
      left: 0;
      background-color: var(--secondary-color);
      transition: var(--transition);
    }
    
    .nav-link:hover:after {
      width: 100%;
    }

    /* Contenedor principal */
    .hero-content {
      position: relative;
      z-index: 2;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      flex-direction: column;
      padding: 2rem;
    }

    .hero-title {
      font-family: 'Montserrat', sans-serif;
      font-size: 4rem;
      font-weight: 800;
      margin-bottom: 1.5rem;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
      opacity: 0;
      transform: translateY(20px);
      animation: fadeInUp 0.8s ease forwards;
    }

    .hero-subtitle {
      font-size: 1.5rem;
      font-weight: 300;
      margin-bottom: 2.5rem;
      max-width: 700px;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
      opacity: 0;
      transform: translateY(20px);
      animation: fadeInUp 0.8s ease 0.2s forwards;
    }

    .btn-group {
      opacity: 0;
      transform: translateY(20px);
      animation: fadeInUp 0.8s ease 0.4s forwards;
    }

    .btn-custom {
      background-color: var(--primary-color);
      border: none;
      font-size: 1.1rem;
      padding: 12px 30px;
      color: var(--light-color);
      border-radius: 30px;
      font-weight: 500;
      letter-spacing: 0.5px;
      box-shadow: 0 4px 6px rgba(37, 99, 235, 0.25);
      transition: var(--transition);
    }
    
    .btn-custom:hover, .btn-custom:focus {
      background-color: var(--primary-dark);
      transform: translateY(-3px);
      box-shadow: 0 6px 12px rgba(37, 99, 235, 0.3);
      color: var(--light-color);
    }

    .btn-outline {
      background-color: transparent;
      border: 2px solid var(--light-color);
      font-size: 1.1rem;
      padding: 10px 28px;
      color: var(--light-color);
      border-radius: 30px;
      font-weight: 500;
      letter-spacing: 0.5px;
      transition: var(--transition);
    }
    
    .btn-outline:hover, .btn-outline:focus {
      background-color: var(--light-color);
      color: var(--primary-dark);
      transform: translateY(-3px);
      box-shadow: 0 6px 12px rgba(255, 255, 255, 0.2);
    }
    
    /* Scroll down indicator */
    .scroll-down {
      position: absolute;
      bottom: 50px;
      left: 50%;
      transform: translateX(-50%);
      animation: bounce 2s infinite;
      opacity: 0.8;
      transition: var(--transition);
      z-index: 5;
    }
    
    .scroll-down:hover {
      opacity: 1;
    }
    
    /* Animaciones */
    @keyframes fadeInUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    @keyframes bounce {
      0%, 20%, 50%, 80%, 100% {
        transform: translateY(0) translateX(-50%);
      }
      40% {
        transform: translateY(-20px) translateX(-50%);
      }
      60% {
        transform: translateY(-10px) translateX(-50%);
      }
    }
    
    /* Media queries para responsividad */
    @media (max-width: 768px) {
      .hero-title {
        font-size: 3rem;
      }
      .hero-subtitle {
        font-size: 1.2rem;
      }
      .btn-group .btn {
        display: block;
        width: 100%;
        margin-bottom: 1rem;
      }
    }
  </style>
</head>
<body>
  <!-- Video de fondo -->
  <video id="bgVideo" autoplay muted loop playsinline>
    <source src="{{ url_for('static', filename='valencia.mp4') }}" type="video/mp4">
    Tu navegador no soporta la reproducción de video.
  </video>

  <!-- Capa oscura sobre el video de fondo -->
  <div class="overlay" aria-hidden="true"></div>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark fixed-top">
    <div class="container">
      <a class="navbar-brand" href="{{ url_for('dashboard') if logged_in_user else url_for('home') }}">
        <i class="fas fa-compass me-2"></i>Recomendación Turística
      </a>
      <button 
        class="navbar-toggler" 
        type="button" 
        data-bs-toggle="collapse" 
        data-bs-target="#navbarContent" 
        aria-controls="navbarContent" 
        aria-expanded="false" 
        aria-label="Toggle navigation"
      >
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarContent">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a class="nav-link" href="/register"><i class="fas fa-user-plus me-1"></i> Registrarse</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="/login"><i class="fas fa-sign-in-alt me-1"></i> Iniciar sesión</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Sección principal de la página -->
  <main class="hero-content">
    <h1 class="hero-title">Explora. Descubre. Disfruta.</h1>
    <p class="hero-subtitle">
      Tu próxima aventura te espera. Encuentra las mejores recomendaciones de destinos turísticos personalizadas para ti.
    </p>
    <div class="btn-group">
      <a href="/register" class="btn btn-custom me-sm-3 mb-3 mb-sm-0">
        <i class="fas fa-rocket me-2"></i>Empieza ahora
      </a>
      <a href="/login" class="btn btn-outline">
        <i class="fas fa-sign-in-alt me-2"></i>Inicia sesión
      </a>
    </div>
    
    <!-- Scroll down indicator -->
    <!-- <a href="#info" class="scroll-down text-white"> -->
    <!--   <i class="fas fa-chevron-down fa-2x"></i> -->
    <!-- </a> -->
  </main>

  <!-- Bootstrap JS y scripts personalizados -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // Cambiar navbar al hacer scroll
    window.addEventListener('scroll', function() {
      const navbar = document.querySelector('.navbar');
      if (window.scrollY > 100) {
        navbar.classList.add('scrolled');
      } else {
        navbar.classList.remove('scrolled');
      }
    });
    
    // Asegurar que el video se reproduzca en diferentes navegadores
    document.addEventListener('DOMContentLoaded', function() {
      const video = document.getElementById('bgVideo');
      video.play().catch(function(error) {
        console.log("Autoplay was prevented:", error);
        // Podríamos mostrar un botón para reproducir manualmente en caso de error
      });
    });
  </script>
</body>
</html>
